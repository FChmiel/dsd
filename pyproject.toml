[project]
name = "dsd"
dynamic = ["version"]
description = "A workspace for agent–data science collaboration: plans, experiment tracking, benchmarks, docs and whiteboards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Francis Chmiel" }]
keywords = ["data-science", "experiment-tracking", "claude-code", "mcp", "agents", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "tomli-w>=1.0",
    "mcp>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/FChmiel/dsd"
Issues = "https://github.com/FChmiel/dsd/issues"

[project.scripts]
dsd = "dsd.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
packaging = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dsd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dsd"]
artifacts = ["src/dsd/web/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
