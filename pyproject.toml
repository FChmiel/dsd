[project]
name = "dsd"
version = "0.1.0"
description = "Agentic development platform for data scientists: plans, docs and experiment tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "tomli-w>=1.0",
]

[project.scripts]
dsd = "dsd.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
