# Build a release. See docs/distribution.md.
#
#   Tag push (v0.2.0): builds the Apple Silicon DMG and the Python wheel and sdist, then makes a DRAFT
#   GitHub Release with notes from CHANGELOG.md. Publishing the draft runs homebrew.yml.
#   Manual run (Actions -> release -> Run workflow, any branch): builds only, as downloadable artifacts.
#
# Optional secrets for signing and notarizing: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8 (contents of the .p8 key).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Check versions and changelog
        run: uv run --no-project python scripts/release.py --check ${{ env.IS_TAG == 'true' && github.ref_name || '' }}

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p ~/private_keys && echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY.p8
            export APPLE_API_KEY_PATH=~/private_keys/AuthKey_$APPLE_API_KEY.p8
          fi
          packaging/build-macos.sh

      - name: Build wheel and sdist
        run: uv build --out-dir pydist

      - name: Smoke test
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python pydist/*.whl
          /tmp/wheel-env/bin/dsd version
          unzip -l pydist/*.whl | grep -q "dsd/web/dist/index.html"
          hdiutil attach -nobrowse -mountpoint /tmp/dsd-dmg app/src-tauri/target/release/bundle/dmg/*.dmg
          /tmp/dsd-dmg/dsd.app/Contents/Resources/backend/dsd/dsd version
          hdiutil detach /tmp/dsd-dmg

      - name: Collect files
        run: |
          mkdir -p out
          cp app/src-tauri/target/release/bundle/dmg/*.dmg pydist/* out/
          (cd out && shasum -a 256 * | tee SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dsd-${{ github.ref_name }}
          path: out/

      - name: Draft the GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          {
            uv run --no-project python scripts/release.py --notes "$VERSION"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "brew install --cask ${OWNER}/dsd/dsd    # Apple Silicon Macs"
            echo '```'
            echo
            echo "Or download the DMG below. The Python wheel installs the \`dsd\` command anywhere: \`uv tool install <wheel URL>\`."
            echo
            echo "SHA-256:"
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag \
            --title "dsd $VERSION" --notes-file notes.md \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)
