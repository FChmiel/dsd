<!doctype html>
<html><head><meta charset="utf-8"><title>dsd</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #111110; color: #b4b3ad;
    font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  body { display: grid; place-items: center; -webkit-user-select: none; cursor: default; }
  .box { text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(160deg,#3b8bea,#1f5fae);
    color: #fff; display: grid; place-items: center; font: 700 22px "SF Mono", Menlo, monospace; margin: 0 auto 14px; }
  #status { margin-top: 6px; color: #7d7c76; max-width: 420px; line-height: 1.5; }
  .dots::after { content: ""; animation: d 1.2s steps(4) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style></head>
<body><div class="box"><div class="logo">ds</div><div style="color:#ecebe8;font-weight:600">dsd</div>
<div id="status"><span class="dots">Starting</span></div></div></body></html>
